name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: openssl headers (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: install moon (unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install moon (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
          Add-Content -Path $env:GITHUB_PATH -Value "$HOME\.moon\bin" -Encoding utf8

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon build (native server)
        run: moon build --target native

      - name: moon test (all backends)
        run: moon test --target all

      - name: generated verbs are fresh
        if: runner.os == 'Linux'
        run: |
          python3 scripts/gen_verbs.py && moon fmt
          git -c core.autocrlf=false diff --ignore-cr-at-eol --exit-code -- src/verbs.mbt src/route/verbs.mbt

      - name: generated routes are fresh
        shell: bash
        run: |
          for dir in src/examples/27-annotations integration/src/ann src/examples/guide/ann src/examples/guide/annapi; do
            moon run src/cmd/routes --target native -- -C . $dir/routes.mbt -o $dir/routes.g.mbt --check
          done

      - name: the guide shows the code it runs
        if: runner.os == 'Linux'
        run: python3 scripts/gen_guide.py --check

      - name: the OpenAPI documents pass the official validator
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/oas"
          "$RUNNER_TEMP/oas/bin/pip" install --quiet openapi-spec-validator
          "$RUNNER_TEMP/oas/bin/python" scripts/check_openapi.py

      - name: annotated example runs
        run: moon run src/examples/27-annotations | grep -q "PURGE /cache -> 200 purged"

      - name: three registrations of the ecosystem example agree
        shell: bash
        run: |
          (cd integration && moon run src/check --target native) > "$RUNNER_TEMP/ecosystem.txt"
          grep -q "same: all three registrations answer alike" "$RUNNER_TEMP/ecosystem.txt"
          grep -q "POST /tasks -> 201" "$RUNNER_TEMP/ecosystem.txt"
          grep -q "POST /tasks -> 422" "$RUNNER_TEMP/ecosystem.txt"

      - name: templates example runs
        run: moon run src/examples/28-templates | grep -q 'href="/users/8"'

      - name: the agent example answers through the mounted service
        run: moon run src/examples/29-agents | grep -q '"text":"pet 7"'

      - name: the docs example serves four readers
        run: moon run src/examples/22-docs-ui | grep -q '/redocly -> 200'

      - name: lint (fmt is clean)
        run: |
          moon fmt && git -c core.autocrlf=false diff --ignore-cr-at-eol --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git -c core.autocrlf=false diff --ignore-cr-at-eol --exit-code

      - name: the skills are valid
        if: runner.os == 'Linux'
        run: |
          for dir in docs/skills/*/; do
            case "$dir" in *CHANGE-ME*) continue ;; esac
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

      # A reader pastes the blocks of the README and the skills into a project, so they have
      # to compile as written, against this commit's source.
      - name: the code in the docs compiles
        if: runner.os == 'Linux'
        run: python3 scripts/check_snippets.py
